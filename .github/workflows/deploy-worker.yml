# Deploy the frontend + Cloudflare Worker backend on every push to main.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (Settings -> Secrets and variables -> Actions). Without them the job is skipped.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: ["main"]
    paths: ["frontend/**", "worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check credentials
        id: creds
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - name: Test
        if: steps.creds.outputs.ok == 'true'
        run: npm test
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy
